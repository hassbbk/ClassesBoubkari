<script>
fetch("../pdf/liste.json")
.then(response => response.json())
.then(data => {

    if (!data["Mecanique"]) return;

    data["Mecanique"].forEach(file => {

        const li = document.createElement("li");
        const a = document.createElement("a");

        a.href = "../pdf/Mecanique/" + file;
        a.textContent = file.replace(".pdf","");
        a.target = "_blank";

        li.appendChild(a);
        document.getElementById("listeMecanique").appendChild(li);
    });

})
.catch(error => {
    console.log("Erreur chargement liste.json :", error);
});
</script>
