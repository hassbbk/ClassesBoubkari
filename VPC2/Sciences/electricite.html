<script>
fetch("pdf/liste.json")
.then(response => response.json())
.then(data => {

    console.log("JSON chargé :", data);

    if (!data["Electricite"]) {
        console.log("Clé Electricite introuvable");
        return;
    }

    data["Electricite"].forEach(file => {

        console.log("Ajout fichier :", file);

        const li = document.createElement("li");
        const a = document.createElement("a");

        a.href = "pdf/Electricite/" + file;
        a.textContent = file;
        a.target = "_blank";

        li.appendChild(a);
        document.getElementById("listeElectricite").appendChild(li);
    });

})
.catch(error => {
    console.log("Erreur chargement liste.json :", error);
});
</script>
