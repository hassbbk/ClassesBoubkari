<script>
window.onload = function() {

    const liste = document.getElementById("listeElectricite");

    if (!liste) {
        console.log("Element introuvable");
        return;
    }

    fetch("pdf/liste.json")
    .then(response => response.json())
    .then(data => {

        if (!data.Electricite) {
            liste.innerHTML = "<li>Aucun document trouvé</li>";
            return;
        }

        data.Electricite.forEach(function(file) {

            const li = document.createElement("li");
            const a = document.createElement("a");

            a.href = "pdf/Electricite/" + encodeURIComponent(file);
            a.textContent = file.replace(".pdf", "");
            a.target = "_blank";

            li.appendChild(a);
            liste.appendChild(li);
        });

    })
    .catch(function(error) {
        console.log("Erreur :", error);
        liste.innerHTML = "<li>Erreur de chargement</li>";
    });

};
</script>
