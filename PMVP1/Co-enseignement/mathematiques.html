<style>
body { 
    font-family: Arial, sans-serif; 
    margin:0; 
    background:#eef2f7; 
}

header { 
    background:#001f3f; 
    color:white; 
    text-align:center;
    padding:20px; 
}

main { 
    max-width:900px; 
    margin:40px auto; 
    padding:20px;
}

.navigation {
    margin-bottom:30px;
}

.nav-btn {
    display:inline-block;
    margin-right:15px;
    padding:8px 15px;
    background:#001f3f;
    color:white;
    text-decoration:none;
    border-radius:5px;
    font-size:14px;
}

.nav-btn:hover {
    background:#003366;
}

ul { 
    list-style:none; 
    padding:0; 
}

li { 
    background:white; 
    padding:15px; 
    margin-bottom:10px; 
    border-left:4px solid #001f3f; 
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

a { 
    text-decoration:none; 
    color:#001f3f; 
}

a:hover {
    text-decoration:underline;
}
</style>
</head>

<body>

<header>
<h1>📐 MATHEMATIQUES - PMVP1</h1>
</header>

<main>

<div class="navigation">
    <a href="javascript:history.back()" class="nav-btn">⬅ Page précédente</a>
    <a href="../../index.html" class="nav-btn">🏠 Accueil</a>
</div>

<h2>Documents disponibles</h2>

<ul id="listeMATHEMATIQUES"></ul>

</main>

<script>
fetch("pdf/liste.json")
.then(response => {
    if (!response.ok) throw new Error("Erreur de chargement : " + response.status);
    return response.json();
})
.then(data => {

    if (!data["MATHEMATIQUES"]) return;

    const liste = document.getElementById("listeMATHEMATIQUES");
    liste.innerHTML = "";

    data["MATHEMATIQUES"].forEach(file => {

        // Ignore les entrées vides ou fictives
        if (!file || file.includes("____")) return;

        const li = document.createElement("li");
        const a = document.createElement("a");

        // encodeURIComponent permet d'encoder correctement les espaces et caractères spéciaux dans l'URL
        a.href = "pdf/MATHEMATIQUES/" + encodeURIComponent(file);
        
        // Supprime l'extension du nom du fichier (.pdf, .xlsx, .ods, etc.) pour l'affichage
        a.textContent = file.replace(/\.[^/.]+$/, "");
        a.target = "_blank";

        li.appendChild(a);
        liste.appendChild(li);
    });

})
.catch(error => {
    console.error("Erreur chargement liste.json :", error);
});
</script>

</body>
</html>
