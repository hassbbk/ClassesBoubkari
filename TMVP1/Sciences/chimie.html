<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chimie - TMVP1</title>

<style>
body { 
    font-family: Arial; 
    margin:0; 
    background:#eef2f7; 
}

header { 
    background:#001f3f; 
    color:white; 
    text-align:center;
    padding:20px; 
}

main { 
    max-width:900px; 
    margin:40px auto; 
    padding:20px;
}

.navigation {
    margin-bottom:30px;
}

.nav-btn {
    display:inline-block;
    margin-right:15px;
    padding:8px 15px;
    background:#001f3f;
    color:white;
    text-decoration:none;
    border-radius:5px;
    font-size:14px;
}

.nav-btn:hover {
    background:#003366;
}

.section-title {
    margin-top:40px;
    padding:10px;
    color:white;
    border-radius:5px;
}

.oxydo {
    background:#c1121f;
}

.acide {
    background:#0077b6;
}

ul { 
    list-style:none; 
    padding:0; 
}

li { 
    background:white; 
    padding:15px; 
    margin-bottom:10px; 
    border-left:4px solid #001f3f; 
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

a { 
    text-decoration:none; 
    color:#001f3f; 
}
</style>
</head>

<body>

<header>
<h1>⚡ Chimie - TMVP1</h1>
</header>

<main>

<div class="navigation">
    <a href="javascript:history.back()" class="nav-btn">⬅ Page précédente</a>
    <a href="../../index.html" class="nav-btn">🏠 Accueil</a>
</div>

<!-- OXYDO REDUCTION -->
<h2 class="section-title oxydo">🔴 Oxydo-réduction</h2>
<ul id="listeOxydo"></ul>

<!-- ACIDE BASE -->
<h2 class="section-title acide">🔵 Acide - Base</h2>
<ul id="listeAcide"></ul>

</main>

<script>
fetch("pdf/liste.json")
.then(response => response.json())
.then(data => {

    if (!data["Chimie"]) return;

    // OXYDO
    if (data["Chimie"]["Oxydo-reduction"]) {
        data["Chimie"]["Oxydo-reduction"].forEach(file => {

            const li = document.createElement("li");
            const a = document.createElement("a");

            a.href = "pdf/Chimie/Oxydo-reduction/" + file;
            a.textContent = file.replace(".pdf","");
            a.target = "_blank";

            li.appendChild(a);
            document.getElementById("listeOxydo").appendChild(li);
        });
    }

    // ACIDE BASE
    if (data["Chimie"]["Acide-base"]) {
        data["Chimie"]["Acide-base"].forEach(file => {

            const li = document.createElement("li");
            const a = document.createElement("a");

            a.href = "pdf/Chimie/Acide-base/" + file;
            a.textContent = file.replace(".pdf","");
            a.target = "_blank";

            li.appendChild(a);
            document.getElementById("listeAcide").appendChild(li);
        });
    }

})
.catch(error => {
    console.log("Erreur chargement liste.json :", error);
});
</script>

</body>
</html>
