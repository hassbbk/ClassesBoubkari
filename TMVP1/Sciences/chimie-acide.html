<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Acide - Base - TMVP1</title>
<style>
body { font-family: Arial; margin:0; background:#eef2f7; }
header { background:#0077b6; color:white; text-align:center; padding:20px; }
main { max-width:900px; margin:40px auto; padding:20px; }
.nav-btn {
    display:inline-block;
    margin-bottom:20px;
    padding:8px 15px;
    background:#001f3f;
    color:white;
    text-decoration:none;
    border-radius:5px;
    font-size:14px;
}
ul { list-style:none; padding:0; }
li {
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-left:4px solid #0077b6;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
a { text-decoration:none; color:#001f3f; }
</style>
</head>
<body>

<header>
<h1>🔵 Acide - Base</h1>
</header>

<main>

<a href="chimie.html" class="nav-btn">⬅ Retour Chimie</a>

<ul id="listeAcide"></ul>

</main>

<script>
fetch("pdf/liste.json")
.then(response => response.json())
.then(data => {

if (!data["Chimie"]["Acide-base"]) return;

data["Chimie"]["Acide-base"].forEach(file => {

    const li = document.createElement("li");
    const a = document.createElement("a");

    a.href = "pdf/Chimie/Acide-base/" + file;
    a.textContent = file.replace(".pdf","");
    a.target = "_blank";

    li.appendChild(a);
    document.getElementById("listeAcide").appendChild(li);
});

});
</script>

</body>
</html>
