<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fonctions - Dérivées - TMVP1</title>

  gtag('config', 'G-GTQZ7TKSY1');

<style>
body { font-family: Arial; margin:0; background:#eef2f7; }
header { background:#c1121f; color:white; text-align:center; padding:25px; }
main { max-width:900px; margin:40px auto; padding:20px; }

.nav-btn {
    display:inline-block;
    margin-bottom:20px;
    padding:8px 15px;
    background:#001f3f;
    color:white;
    text-decoration:none;
    border-radius:5px;
    font-size:14px;
}

ul { list-style:none; padding:0; }

li {
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-left:4px solid #c1121f;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

a { text-decoration:none; color:#001f3f; font-weight:bold; }
</style>
</head>

<body>

<header>
<h1>🔴 Fonctions – Dérivées</h1>
</header>

<main>

<a href="fonctions.html" class="nav-btn">⬅ Retour Fonctions</a>

<ul id="liste"></ul>

</main>

<script>
fetch("pdf/liste.json")
.then(response => response.json())
.then(data => {

if (!data["Fonctions"] || !data["Fonctions"]["Fonctions-derivees"]) return;

data["Fonctions"]["Fonctions-derivees"].forEach(file => {

    const li = document.createElement("li");
    const a = document.createElement("a");

    a.href = "pdf/Fonctions/Fonctions-derivees/" + file;
    a.textContent = file.replace(".pdf","");
    a.target = "_blank";

    li.appendChild(a);
    document.getElementById("liste").appendChild(li);
});

})
.catch(error => console.log("Erreur JSON :", error));
</script>

</body>
</html>
