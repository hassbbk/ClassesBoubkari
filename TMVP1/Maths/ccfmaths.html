<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CcfMaths - Maths</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GTQZ7TKSY1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-GTQZ7TKSY1');
</script>

<style>
body { font-family: Arial; margin:0; background:#eef2f7; }
header { background:#001f3f; color:white; text-align:center; padding:20px; }
.logo { max-height:70px; }
main { max-width:900px; margin:40px auto; }

ul { list-style:none; padding:0; }

li { 
    background:white; 
    padding:15px; 
    margin-bottom:10px; 
    border-left:4px solid #001f3f; 
}

a { text-decoration:none; color:#001f3f; }

.retour { 
    display:inline-block; 
    margin-bottom:20px; 
    color:#001f3f; 
}
</style>
</head>

<body>

<header>
<img src="/assets/logo.png" class="logo">
<h1>📘 CcfMaths</h1>
</header>

<main>

<a href="index.html" class="retour">⬅ Retour</a>

<ul id="listeCcfMaths"></ul>

</main>

<script>
fetch("pdf/liste.json")
.then(response => response.json())
.then(data => {

    const fichiers = data["CcfMaths"];
    if (!fichiers) return;

    fichiers.forEach(file => {

        const li = document.createElement("li");
        const a = document.createElement("a");

        a.href = "#";
        a.textContent = file.replace(".pdf","");

        a.onclick = function() {

            // ✅ TRACKING GOOGLE
            if (typeof gtag === "function") {
                gtag('event', 'clic_pdf', {
                    'event_category': 'CcfMaths',
                    'event_label': file
                });
            }

            // ✅ OUVERTURE PDF
            window.open("pdf/CcfMaths/" + file, "_blank");
        };

        li.appendChild(a);
        document.getElementById("listeCcfMaths").appendChild(li);
    });

})
.catch(error => console.log("Erreur JSON :", error));
</script>

</body>
